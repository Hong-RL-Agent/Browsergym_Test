name: J.A.W.S Port Batch Training

on:
  workflow_dispatch:
    inputs:
      start_port:
        description: "Start localhost port"
        required: true
        default: "9220"
      end_port:
        description: "End localhost port"
        required: true
        default: "9309"
      batch_size:
        description: "Sites per batch"
        required: true
        default: "10"
      total_updates:
        description: "PPO updates per batch"
        required: true
        default: "20"
      episodes_per_site:
        description: "Training episodes per site"
        required: true
        default: "1"
      max_steps:
        description: "Max steps per episode"
        required: true
        default: "25"
      eval_episodes:
        description: "Evaluation episodes per site"
        required: true
        default: "3"

jobs:
  port-batch-training:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create venv
        run: |
          python -m venv .venv
          .\.venv\Scripts\python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          if (Test-Path requirements.txt) {
            .\.venv\Scripts\python -m pip install -r requirements.txt
          }
          if (Test-Path BrowserGym) {
            .\.venv\Scripts\python -m pip install -e BrowserGym
          }
          .\.venv\Scripts\python -m playwright install chromium

      - name: Run port batch pipeline
        run: |
          .\.venv\Scripts\python scripts\run_all_port_batches.py `
            --start-port ${{ inputs.start_port }} `
            --end-port ${{ inputs.end_port }} `
            --batch-size ${{ inputs.batch_size }} `
            --total-updates ${{ inputs.total_updates }} `
            --episodes-per-site ${{ inputs.episodes_per_site }} `
            --max-steps ${{ inputs.max_steps }} `
            --eval-episodes ${{ inputs.eval_episodes }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jaws-port-batch-artifacts
          path: |
            artifacts/preflight/**
            artifacts/training/**
            artifacts/evaluations/**
            artifacts/final/**
            artifacts/reports/**
            configs/generated/**
