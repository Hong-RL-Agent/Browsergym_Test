<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>RAWD v3 Select Fixture</title><style>body{margin:24px;font:16px sans-serif}select{display:block;width:220px;height:36px;margin-top:8px}</style></head>
<body>
  <main>
    <h1>RAWD v3 native select fixture</h1>
    <label for="fixture-select">Choose an option</label>
    <select id="fixture-select">
      <option value="">Choose an option</option>
      <option value="alpha">Alpha</option>
      <option value="beta">Beta</option>
    </select>
    <label for="custom-combobox">Custom combobox</label>
    <div id="custom-combobox" role="combobox" aria-label="Custom combobox" tabindex="0" style="display:block;width:220px;height:36px;line-height:36px;margin-top:16px;border:1px solid #888">Custom value</div>
  </main>
</body>
</html>
